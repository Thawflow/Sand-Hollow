  <text x="95" y="112" font-size="13" fill="#888">100 格全亮</text>
  <g transform="translate(95,120)">
    <!-- 20 segments all active -->
    <g stroke="#222" stroke-width="2" fill="#fff">
      <rect x="0" y="0" width="26" height="34" rx="4" transform="rotate(-0.4)"/>
      <rect x="29" y="1" width="26" height="34" rx="4" transform="rotate(0.3)"/>
      <rect x="58" y="0" width="26" height="34" rx="4"/>
      <rect x="87" y="1" width="26" height="34" rx="4" transform="rotate(-0.5)"/>
      <rect x="116" y="0" width="26" height="34" rx="4"/>
      <rect x="145" y="1" width="26" height="34" rx="4" transform="rotate(0.4)"/>
      <rect x="174" y="0" width="26" height="34" rx="4"/>
      <rect x="203" y="1" width="26" height="34" rx="4" transform="rotate(-0.3)"/>
      <rect x="232" y="0" width="26" height="34" rx="4"/>
      <rect x="261" y="1" width="26" height="34" rx="4" transform="rotate(0.5)"/>
      <rect x="290" y="0" width="26" height="34" rx="4"/>
      <rect x="319" y="1" width="26" height="34" rx="4" transform="rotate(-0.4)"/>
      <rect x="348" y="0" width="26" height="34" rx="4"/>
      <rect x="377" y="1" width="26" height="34" rx="4" transform="rotate(0.3)"/>
      <rect x="406" y="0" width="26" height="34" rx="4"/>
      <rect x="435" y="1" width="26" height="34" rx="4" transform="rotate(-0.5)"/>
      <rect x="464" y="0" width="26" height="34" rx="4"/>
      <rect x="493" y="1" width="26" height="34" rx="4" transform="rotate(0.4)"/>
      <rect x="522" y="0" width="26" height="34" rx="4"/>
      <rect x="551" y="1" width="26" height="34" rx="4"/>
    </g>
  </g>

  <!-- 问1 剩50 -->
  <text x="30" y="202" font-size="15" fill="#222">问 1</text>
  <text x="95" y="202" font-size="13" fill="#e8862e">"在 50 之前！" → 划掉 50 格</text>
  <g transform="translate(95,210)">
    <g stroke="#bbb" stroke-width="2" fill="#f2f2f2">
      <rect x="290" y="0" width="26" height="34" rx="4"/><rect x="319" y="1" width="26" height="34" rx="4"/>
      <rect x="348" y="0" width="26" height="34" rx="4"/><rect x="377" y="1" width="26" height="34" rx="4"/>
      <rect x="406" y="0" width="26" height="34" rx="4"/><rect x="435" y="1" width="26" height="34" rx="4"/>
      <rect x="464" y="0" width="26" height="34" rx="4"/><rect x="493" y="1" width="26" height="34" rx="4"/>
      <rect x="522" y="0" width="26" height="34" rx="4"/><rect x="551" y="1" width="26" height="34" rx="4"/>
