<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" font-family="'Comic Sans MS','Segoe Print',cursive,sans-serif">
  <!-- W13-L01 雪地寻宝：每问一次砍一半（原创插图，教学法致谢 Grokking Algorithms） -->
  <text x="380" y="38" text-anchor="middle" font-size="26" fill="#222">❄️ 雪地寻宝：每问一次，砍掉一半</text>
  <text x="380" y="62" text-anchor="middle" font-size="14" fill="#888">100 格雪原埋着 1 根冻鱼干 · 每格 = 5 格雪原</text>

