      <rect x="58" y="0" width="26" height="34" rx="4"/><rect x="87" y="1" width="26" height="34" rx="4"/>
      <rect x="116" y="0" width="26" height="34" rx="4"/>
    </g>
  </g>

  <!-- 问3 剩13 -->
  <text x="30" y="382" font-size="15" fill="#222">问 3</text>
  <text x="95" y="382" font-size="13" fill="#e8862e">"在 13 之前！" → 剩 13 格</text>
  <g transform="translate(95,390)">
    <g stroke="#bbb" stroke-width="2" fill="#f2f2f2">
      <rect x="87" y="0" width="26" height="34" rx="4"/><rect x="116" y="1" width="26" height="34" rx="4"/>
    </g>
    <g stroke="#bbb" stroke-width="2">
      <line x1="93" y1="6" x2="107" y2="28"/><line x1="107" y1="6" x2="93" y2="28"/>
      <line x1="122" y1="6" x2="136" y2="28"/><line x1="136" y1="6" x2="122" y2="28"/>
    </g>
    <g stroke="#222" stroke-width="2" fill="#fff">
      <rect x="0" y="0" width="26" height="34" rx="4"/><rect x="29" y="1" width="26" height="34" rx="4"/>
      <rect x="58" y="0" width="26" height="34" rx="4"/>
    </g>
  </g>

  <!-- 问4-7 收敛到1 -->
  <text x="30" y="472" font-size="15" fill="#222">问 4-7</text>
  <text x="95" y="472" font-size="13" fill="#e8862e">13 → 6 → 3 → 🎯</text>
  <g transform="translate(95,480)">
    <g stroke="#222" stroke-width="2" fill="#fff">
      <rect x="0" y="0" width="26" height="34" rx="4"/>
      <rect x="29" y="1" width="26" height="34" rx="4" fill="#f2f2f2" stroke="#bbb"/>
      <rect x="58" y="0" width="26" height="34" rx="4" fill="#f2f2f2" stroke="#bbb"/>
    </g>
    <!-- 目标格：冻鱼干 -->
    <g transform="translate(2,2)">
      <rect x="0" y="0" width="26" height="34" rx="4" fill="#ffd9b3" stroke="#e8862e" stroke-width="3"/>
      <path d="M6,18 q4,-8 10,-8 l4,0 l-3,3 l3,3 l-4,0 q-6,0 -10,2 z" fill="#e8862e"/>
      <circle cx="13" cy="13.5" r="1.2" fill="#fff"/>
    </g>
    <text x="95" y="22" font-size="14" fill="#222">← 第 33 格，7 次问完，冻鱼干到手 🐟</text>
  </g>

  <!-- 底注 -->
  <text x="380" y="580" text-anchor="middle" font-size="14" fill="#888">每多问一次，能搞定的雪原翻一倍：7 次 → 128 格 · 10 次 → 1024 格 · 20 次 → 100 万格</text>
  <text x="380" y="602" text-anchor="middle" font-size="11" fill="#ccc">插图原创（沙坑 course-algo）· 教学法致谢《算法图解/Grokking Algorithms》Ch1</text>
