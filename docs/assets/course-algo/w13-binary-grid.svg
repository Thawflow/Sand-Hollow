      <line x1="325" y1="6" x2="339" y2="28"/><line x1="339" y1="6" x2="325" y2="28"/>
      <line x1="354" y1="6" x2="368" y2="28"/><line x1="368" y1="6" x2="354" y2="28"/>
      <line x1="383" y1="6" x2="397" y2="28"/><line x1="397" y1="6" x2="383" y2="28"/>
      <line x1="412" y1="6" x2="426" y2="28"/><line x1="426" y1="6" x2="412" y2="28"/>
      <line x1="441" y1="6" x2="455" y2="28"/><line x1="455" y1="6" x2="441" y2="28"/>
      <line x1="470" y1="6" x2="484" y2="28"/><line x1="484" y1="6" x2="470" y2="28"/>
      <line x1="499" y1="6" x2="513" y2="28"/><line x1="513" y1="6" x2="499" y2="28"/>
      <line x1="528" y1="6" x2="542" y2="28"/><line x1="542" y1="6" x2="528" y2="28"/>
      <line x1="557" y1="6" x2="571" y2="28"/><line x1="571" y1="6" x2="557" y2="28"/>
    </g>
    <g stroke="#222" stroke-width="2" fill="#fff">
      <rect x="0" y="0" width="26" height="34" rx="4"/><rect x="29" y="1" width="26" height="34" rx="4"/>
      <rect x="58" y="0" width="26" height="34" rx="4"/><rect x="87" y="1" width="26" height="34" rx="4"/>
      <rect x="116" y="0" width="26" height="34" rx="4"/><rect x="145" y="1" width="26" height="34" rx="4"/>
      <rect x="174" y="0" width="26" height="34" rx="4"/><rect x="203" y="1" width="26" height="34" rx="4"/>
      <rect x="232" y="0" width="26" height="34" rx="4"/><rect x="261" y="1" width="26" height="34" rx="4"/>
    </g>
  </g>

  <!-- 问2 剩25 -->
  <text x="30" y="292" font-size="15" fill="#222">问 2</text>
  <text x="95" y="292" font-size="13" fill="#e8862e">"在 25 之前！" → 又划掉 25 格</text>
  <g transform="translate(95,300)">
    <g stroke="#bbb" stroke-width="2" fill="#f2f2f2">
      <rect x="145" y="0" width="26" height="34" rx="4"/><rect x="174" y="1" width="26" height="34" rx="4"/>
      <rect x="203" y="0" width="26" height="34" rx="4"/><rect x="232" y="1" width="26" height="34" rx="4"/>
      <rect x="261" y="0" width="26" height="34" rx="4"/>
    </g>
    <g stroke="#bbb" stroke-width="2">
      <line x1="151" y1="6" x2="165" y2="28"/><line x1="165" y1="6" x2="151" y2="28"/>
      <line x1="180" y1="6" x2="194" y2="28"/><line x1="194" y1="6" x2="180" y2="28"/>
      <line x1="209" y1="6" x2="223" y2="28"/><line x1="223" y1="6" x2="209" y2="28"/>
      <line x1="238" y1="6" x2="252" y2="28"/><line x1="252" y1="6" x2="238" y2="28"/>
      <line x1="267" y1="6" x2="281" y2="28"/><line x1="281" y1="6" x2="267" y2="28"/>
