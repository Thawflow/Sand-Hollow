<!DOCTYPE html>
<html lang="zh-CN">
<head>

<script>(function(){function getLid(){return localStorage.getItem('learning-id')||localStorage.getItem('thawpawActiveId')||'';}function setLid(id){try{localStorage.setItem('learning-id',id);localStorage.setItem('thawpawActiveId',id);}catch(e){}}window.getLid=getLid;window.setLid=setLid;})();</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="description" content="ThawPaw Games - 苗苗做的游戏合集！猫武士大冒险、少年剑客闯江湖、地下城探险、贪吃蛇商店，快来玩吧！" />
<title>🎮 游戏小窝 · 沙坑训练场</title>
<style>
:root{--bg:#0f1420;--card:#171e2e;--card2:#1e2740;--border:#2a3550;--text:#e8ecf4;--text2:#8b96ad;--accent:#5b9dff;--accent2:#7c6cff;--ok:#3ecf8e;--warn:#ffb454}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,sans-serif;min-height:100vh;padding:20px 16px 90px}
.back{position:fixed;top:14px;left:14px;z-index:50;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;background:var(--card);border:1px solid var(--border);color:var(--text2);text-decoration:none;font-size:.9rem;transition:all .15s}
.back:hover{color:var(--accent);border-color:var(--accent)}
h1{font-size:1.5rem;text-align:center;margin:26px 0 6px}
.sub{color:var(--text2);text-align:center;font-size:.88rem;margin-bottom:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;max-width:960px;margin:0 auto}
.game-card{display:block;text-decoration:none;color:var(--text);background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--border);transition:transform .22s cubic-bezier(.4,0,.2,1),box-shadow .22s,border-color .22s;cursor:pointer}
.game-card:hover{transform:translateY(-6px) scale(1.015);box-shadow:0 16px 48px rgba(124,108,255,.18);border-color:rgba(124,108,255,.4)}
.game-card:active{transform:translateY(-2px) scale(1.005)}
.thumb{height:130px;display:flex;align-items:center;justify-content:center;font-size:54px;background:linear-gradient(135deg,var(--card2),var(--card))}
.body{padding:14px 16px 16px}
.body h3{font-size:1.02rem;margin-bottom:6px}
.body p{color:var(--text2);font-size:.82rem;line-height:1.5}
.tag{display:inline-block;margin-top:10px;font-size:.72rem;padding:3px 10px;border-radius:99px;background:rgba(91,157,255,.12);color:var(--accent)}
footer{text-align:center;color:var(--text2);font-size:.75rem;margin-top:34px}
footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<a class="back" href="/">🏖️ 回沙坑</a>
<h1>🎮 游戏小窝</h1>
<p class="sub">学累了？来一盘。都是 ThawPaw 亲手做的 🐾</p>
<div class="grid">
  <a class="game-card" href="moonstone-quest.html">
    <div class="thumb">🔮</div>
    <div class="body"><h3>猫武士大冒险</h3><p>猫咪学徒深入地下10层，寻找传说中的月亮石 🔮</p><span class="tag">冒险</span></div>
  </a>
  <a class="game-card" href="snake.html">
    <div class="thumb">🐍</div>
    <div class="body"><h3>贪吃蛇商店</h3><p>Classic snake with shops, banks, and backpacks!</p><span class="tag">经营</span></div>
  </a>
  <a class="game-card" href="sword-master.html">
    <div class="thumb">⚔️</div>
    <div class="body"><h3>少年剑客闯江湖</h3><p>少年剑客林风闯庙宇，六波Boss挑战 · 无限关卡 · 买武器 · 变身Boss！⚔️</p><span class="tag">动作</span></div>
  </a>
  <a class="game-card" href="minesweeper.html">
    <div class="thumb">💣</div>
    <div class="body"><h3>扫雷</h3><p>经典扫雷 · 鼠标左键翻格 · 右键标旗 · 笑脸重置 💣</p><span class="tag">益智</span></div>
  </a>
</div>
<footer>🏖️ <a href="/">沙坑训练场</a> · 学编程，顺便玩自己做的游戏</footer>
</body>
</html>
